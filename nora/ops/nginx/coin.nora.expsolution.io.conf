# nora.coin.expsolution.io — Nora COIN Product Nginx Config
#
#   frontend : nginx phục vụ nora/coin/frontend/dist (bản build Vite COIN)
#   backend  : /api/* -> nora-coin (127.0.0.1:18012)
#   ws       : /ws/*  -> nora-coin (WebSocket upgrade)
#   charts   : /charts/* -> nora-coin
#
server {
    listen 80;
    listen [::]:80;
    server_name nora.coin.expsolution.io coin.nora.expsolution.io;

    access_log /var/log/nginx/nora.coin.expsolution.io.access.log;
    error_log  /var/log/nginx/nora.coin.expsolution.io.error.log;

    # Cloudflare — khôi phục IP thật
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.64.0/18;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 20m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # ── COIN frontend (dist) ──
    root /home/vmc03/norabt/nora/coin/frontend/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # ── COIN backend API ──
    location /api/ {
        proxy_pass http://127.0.0.1:18012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Charts (đường biểu đồ, dữ liệu OHLCV) ──
    location /charts/ {
        proxy_pass http://127.0.0.1:18012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── WebSocket (live bot streaming) ──
    location /ws/ {
        proxy_pass http://127.0.0.1:18012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
