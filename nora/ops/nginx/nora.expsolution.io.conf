# nora.expsolution.io — Nora Backtest. Cài bằng ops/deploy_nginx.sh
# (symlink /etc/nginx/sites-enabled/nora.expsolution.io.conf -> file này, theo quy ước các site khác trên máy).
# Mọi tên đều có tiền tố "nora" (log) để không đè/không đụng vhost khác; không default_server, không khai báo cấp http{}.
#
#   frontend : nginx phục vụ thẳng frontend/dist (bản build Vite), SPA fallback về index.html
#   backend  : /api/* -> nora-api (uvicorn 127.0.0.1:18010, systemd user unit trong nora.slice)
#   data     : nora/data nằm yên trên đĩa, chỉ đọc qua API — nginx KHÔNG phơi thư mục này
#
# TLS kết thúc ở Cloudflare (như các site khác trên máy), vhost nghe :80.
# DNS (Cloudflare, zone expsolution.io): A "nora" -> 203.113.135.195, Proxied (cam).

server {
    listen 80;
    listen [::]:80;
    server_name nora.expsolution.io;

    access_log /var/log/nginx/nora.expsolution.io.access.log;
    error_log  /var/log/nginx/nora.expsolution.io.error.log;

    # Cloudflare — khôi phục IP thật của người truy cập
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Không có Basic Auth (theo yêu cầu): ai có link đều dùng được toàn bộ API.
    # Muốn chặn lại: Cloudflare Access cho nora.expsolution.io, hoặc auth_basic ở đây.

    client_max_body_size 20m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # ── Apex domain: Khong con phuc vu SPA UI view (P0 Gate) ──
    location = / {
        default_type application/json;
        return 410 '{"ok":false,"code":"APEX_VIEW_RETIRED","message":"Giao dien tren domain goc nora.expsolution.io da ngung phuc vu view. Vui long su dung https://coin.nora.expsolution.io hoac https://edu.nora.expsolution.io","coin":"https://coin.nora.expsolution.io","edu":"https://edu.nora.expsolution.io"}';
    }

    location /edu {
        return 302 https://edu.nora.expsolution.io$request_uri;
    }

    location /coin {
        return 302 https://coin.nora.expsolution.io$request_uri;
    }

    location ~ ^/(portfolio|backtest|alpha|live|history) {
        return 302 https://coin.nora.expsolution.io/coin$request_uri;
    }

    # ── backend ──
    location /api/ {
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job nặng chạy nền (trả job id ngay); vài endpoint đồng bộ (chart, custom backtest) có thể lâu.
        # Cloudflare free cắt ở 100s dù nginx đợi lâu hơn.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# SUBDOMAINS: Tự động kích hoạt COIN và EDU qua symlink có sẵn của nora.expsolution.io.conf
# ══════════════════════════════════════════════════════════════════════════════
include /home/vmc03/norabt/nora/ops/nginx/coin.nora.expsolution.io.conf;
include /home/vmc03/norabt/nora/ops/nginx/edu.nora.expsolution.io.conf;

